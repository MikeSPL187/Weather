<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Aura — онбординг</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Unbounded:wght@300;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE7A8}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(0.5);opacity:0.9}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: {{bg}}; font-family: 'Manrope', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 40px 24px 32px;">

  <header style="display: flex; align-items: center; justify-content: space-between;">
    <div role="img" aria-label="{{stepLabel}}" style="display: flex; gap: 6px;">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
        <span style="height: 6px; border-radius: 3px; {{d.s}}"></span>
      </sc-for>
    </div>
    <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 4px; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.88); text-decoration: none;">Пропустить</a>
  </header>

  <div style="position: relative; height: 330px; margin-top: 16px; flex-shrink: 0;">
    <div aria-hidden="true" style="position: absolute; left: 51px; bottom: 6px; width: 240px; height: 58px;">
      <div style="position: absolute; left: 0; top: 16px; width: 240px; height: 42px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.20), rgba(255,255,255,0.04)); box-shadow: 0 24px 40px rgba(0,0,0,0.28);"></div>
      <div style="position: absolute; left: 0; top: 0; width: 240px; height: 42px; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,0.42), rgba(255,255,255,0.08) 72%); border: 1px solid rgba(255,255,255,0.40);"></div>
    </div>

    <sc-if value="{{is0}}" hint-placeholder-val="{{ true }}">
      <div aria-hidden="true" style="position: absolute; left: 46px; top: 30px; width: 250px; height: 250px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,236,170,0.22) 0deg 5deg, rgba(255,236,170,0) 5deg 18deg); -webkit-mask-image: radial-gradient(circle, transparent 36%, #000 40%, transparent 70%); mask-image: radial-gradient(circle, transparent 36%, #000 40%, transparent 70%); animation: spin 40s linear infinite;"></div>
      <div aria-hidden="true" style="position: absolute; left: 96px; top: 80px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #FFF8D6 0%, #FFD86B 28%, #FFA92E 62%, #E2701A 100%); box-shadow: 0 0 70px rgba(255,190,80,0.75), inset -14px -18px 32px rgba(180,60,0,0.45); animation: float 6s ease-in-out infinite;"></div>
      <div aria-hidden="true" style="position: absolute; left: 186px; top: 186px; width: 150px; height: 80px; animation: drift 9s ease-in-out infinite;">
        <div style="position: absolute; left: 0; top: 34px; width: 60px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #EEF3FF 45%, #BFCBE6 100%);"></div>
        <div style="position: absolute; left: 30px; top: 6px; width: 76px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #EEF3FF 45%, #BFCBE6 100%);"></div>
        <div style="position: absolute; left: 86px; top: 26px; width: 60px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #EEF3FF 45%, #BFCBE6 100%);"></div>
      </div>
    </sc-if>

    <sc-if value="{{is1}}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="position: absolute; left: 131px; top: 250px; width: 80px; height: 28px; border-radius: 50%; border: 2px solid rgba(111,227,255,0.8); animation: ping 2.4s ease-out infinite;"></div>
      <div aria-hidden="true" style="position: absolute; left: 131px; top: 250px; width: 80px; height: 28px; border-radius: 50%; border: 2px solid rgba(111,227,255,0.8); animation: ping 2.4s ease-out 1.2s infinite;"></div>
      <div aria-hidden="true" style="position: absolute; left: 116px; top: 60px; width: 110px; height: 200px; animation: float 5s ease-in-out infinite;">
        <div style="position: absolute; left: 0; top: 0; width: 110px; height: 110px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: radial-gradient(circle at 30% 30%, #FFE3A0 0%, #FFB547 45%, #D9721C 100%); box-shadow: inset -10px -12px 24px rgba(150,60,0,0.40), 0 0 40px rgba(255,181,71,0.45);"></div>
        <div style="position: absolute; left: 33px; top: 33px; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF, #DDE5F5);"></div>
      </div>
    </sc-if>

    <sc-if value="{{is2}}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="position: absolute; left: 46px; top: 70px; width: 250px; height: 120px; animation: drift 10s ease-in-out infinite;">
        <div style="position: absolute; left: 0; top: 50px; width: 96px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #C9D3E6 0%, #8592AD 50%, #4B5670 100%); box-shadow: inset -10px -12px 22px rgba(20,25,45,0.45);"></div>
        <div style="position: absolute; left: 56px; top: 0; width: 128px; height: 116px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #D5DDEE 0%, #8D9AB5 50%, #4B5670 100%); box-shadow: inset -12px -14px 26px rgba(20,25,45,0.45);"></div>
        <div style="position: absolute; left: 150px; top: 36px; width: 100px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #C9D3E6 0%, #8592AD 50%, #4B5670 100%); box-shadow: inset -10px -12px 22px rgba(20,25,45,0.45);"></div>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 216px; top: 40px; width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(180deg, #FFD58F, #FFB547); color: #1A1206; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(0,0,0,0.35); transform: rotate(10deg); animation: float 4s ease-in-out infinite;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      </div>
    </sc-if>
  </div>

  <h1 style="margin: 20px 0 0; font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 28px; line-height: 1.2; letter-spacing: -0.5px;">{{title}}</h1>
  <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.88);">{{text}}</p>

  <sc-if value="{{is2}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 16px;">
      <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
        <button onClick="{{a.toggle}}" aria-pressed="{{a.on}}" style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer;">
          <span style="flex-grow: 1;">{{a.label}}</span>
          <span aria-hidden="true" style="width: 44px; height: 26px; border-radius: 13px; position: relative; flex-shrink: 0; {{a.track}}"><span style="position: absolute; top: 3px; width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; {{a.knob}}"></span></span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{next}}" style="height: 56px; border-radius: 28px; border: 0; background: #FFB547; color: #1A1206; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">{{primary}}</button>
    </sc-if>
    <sc-if value="{{is2}}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" style="height: 56px; border-radius: 28px; background: #FFB547; color: #1A1206; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Готово</a>
    </sc-if>
    <sc-if value="{{is1}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{next}}" style="height: 48px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.30); background: transparent; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">Выбрать город вручную</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, alerts: [true, true, false] };
  }
  renderVals() {
    const step = this.state.step;
    const S = [
      { bg: 'linear-gradient(180deg, #1D4ED8 0%, #3B82F6 55%, #6EA8F7 100%)', title: 'Погода, которую хочется открывать', text: 'Живая 3D-сцена показывает, что за окном сейчас и что будет через час. Без рекламы.', primary: 'Начать' },
      { bg: 'linear-gradient(180deg, #0A1030 0%, #15205A 60%, #22307A 100%)', title: 'Прогноз для вашего района', text: 'Геолокация нужна для прогноза осадков по минутам. Данные хранятся на серверах в России и не передаются третьим лицам.', primary: 'Разрешить геолокацию' },
      { bg: 'linear-gradient(180deg, #141B2B 0%, #2A3650 55%, #45546F 100%)', title: 'Только важные уведомления', text: 'Выберите, о чём предупреждать. Всё можно поменять в настройках.', primary: '' }
    ];
    const s = S[step];
    const dots = [0, 1, 2].map((i) => ({ s: i === step ? 'width: 24px; background: #FFFFFF;' : 'width: 6px; background: rgba(255,255,255,0.45);' }));
    const L = ['Дождь начнётся через 15 минут', 'Гроза и штормовые предупреждения МЧС', 'Утренняя сводка в 7:30'];
    const alerts = L.map((label, i) => {
      const on = this.state.alerts[i];
      return {
        label, on: on ? 'true' : 'false',
        track: on ? 'background: #34C77B;' : 'background: rgba(255,255,255,0.25);',
        knob: on ? 'left: 21px;' : 'left: 3px;',
        toggle: () => { const a = this.state.alerts.slice(); a[i] = !a[i]; this.setState({ alerts: a }); }
      };
    });
    return {
      bg: s.bg, title: s.title, text: s.text, primary: s.primary,
      stepLabel: 'Шаг ' + (step + 1) + ' из 3',
      is0: step === 0, is1: step === 1, is2: step === 2, notLast: step < 2,
      dots, alerts,
      next: () => this.setState({ step: Math.min(2, step + 1) })
    };
  }
}
</script>
</body>
</html>
