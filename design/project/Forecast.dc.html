<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Aura — прогноз на 10 дней</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Unbounded:wght@300;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE7A8}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; box-sizing: border-box; background: linear-gradient(180deg, #0A1030 0%, #15205A 60%, #22307A 100%); font-family: 'Manrope', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 54px 16px 0;">

  <div aria-hidden="true" style="position: absolute; right: -60px; top: -40px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,216,107,0.55), rgba(255,169,46,0.18) 50%, rgba(255,169,46,0) 70%);"></div>

  <header style="padding: 0 8px; position: relative;">
    <div style="font-size: 13px; color: rgba(255,255,255,0.80); font-weight: 600;">Москва</div>
    <h1 style="margin: 2px 0 0; font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 28px; letter-spacing: -0.5px;">10 дней</h1>
  </header>

  <div style="margin-top: 16px; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 22px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); position: relative;">
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 10px; background: rgba(255,181,71,0.22); color: #FFC56B; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
    </span>
    <div style="font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.92);">Тепло до пятницы, в выходные дожди и похолодание. 30 октября — первый мокрый снег.</div>
  </div>

  <div style="display: flex; justify-content: space-between; padding: 16px 12px 6px; font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 600;">
    <span>День</span><span>Осадки · мин — макс</span>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0 0 110px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex-grow: 1;">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="10">
      <li style="border-radius: 20px; background: {{d.bg}}; border: 1px solid rgba(255,255,255,0.12);">
        <button onClick="{{d.toggle}}" aria-expanded="{{d.exp}}" style="width: 100%; min-height: 56px; border: 0; background: transparent; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; text-align: left;">
          <span style="width: 74px; display: flex; flex-direction: column;">
            <span style="font-size: 15px; font-weight: 700;">{{d.label}}</span>
            <span style="font-size: 12px; color: rgba(255,255,255,0.75);">{{d.date}}</span>
          </span>
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; {{d.orb}}"></span>
          <span style="width: 36px; font-size: 12px; font-weight: 700; color: #9FEFFF; text-align: right;">{{d.pop}}</span>
          <span style="width: 30px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.80); text-align: right;">{{d.min}}</span>
          <span aria-hidden="true" style="flex-grow: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); position: relative;">
            <span style="position: absolute; top: 0; height: 6px; border-radius: 3px; box-shadow: 0 0 10px rgba(255,200,120,0.35); {{d.bar}}"></span>
          </span>
          <span style="width: 30px; font-size: 15px; font-weight: 700;">{{d.max}}</span>
        </button>
        <sc-if value="{{d.open}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px;">
            <div style="font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.88);">{{d.desc}}</div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
              <div style="padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.08);"><div style="font-size: 11px; color: rgba(255,255,255,0.75);">Ветер</div><div style="font-size: 14px; font-weight: 700;">{{d.wind}}</div></div>
              <div style="padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.08);"><div style="font-size: 11px; color: rgba(255,255,255,0.75);">УФ-индекс</div><div style="font-size: 14px; font-weight: 700;">{{d.uv}}</div></div>
              <div style="padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.08);"><div style="font-size: 11px; color: rgba(255,255,255,0.75);">Влажность</div><div style="font-size: 14px; font-weight: 700;">{{d.hum}}</div></div>
            </div>
          </div>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Основная навигация" style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 68px; border-radius: 34px; background: rgba(8,14,38,0.70); border: 1px solid rgba(255,255,255,0.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.20), 0 16px 40px rgba(0,0,0,0.30); backdrop-filter: blur(30px); display: flex; align-items: center; padding: 0 8px; gap: 4px;">
    <a href="Main.dc.html" style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: rgba(255,255,255,0.80); font-size: 11px; font-weight: 600;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Сейчас</a>
    <a href="Forecast.dc.html" aria-current="page" style="flex: 1; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.16); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #FFFFFF; font-size: 11px; font-weight: 700;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Прогноз</a>
    <a href="Radar.dc.html" style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: rgba(255,255,255,0.80); font-size: 11px; font-weight: 600;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>Карта</a>
    <a href="Assistant.dc.html" style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: rgba(255,255,255,0.80); font-size: 11px; font-weight: 600;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Ассистент</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 0 };
  }
  renderVals() {
    const ORB = {
      sun: 'background: radial-gradient(circle at 35% 30%, #FFF4C2 0%, #FFC94A 45%, #F08A1C 100%); box-shadow: 0 0 12px rgba(255,190,80,0.6);',
      cloud: 'background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #DDE5F5 55%, #A7B4CF 100%);',
      rain: 'background: radial-gradient(circle at 35% 30%, #C9D3E6 0%, #8592AD 55%, #4B5670 100%); box-shadow: 0 6px 0 -3px #8FD8FF;',
      snow: 'background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #EAF2FF 50%, #B8C8E6 100%); box-shadow: 0 0 10px rgba(255,255,255,0.6);'
    };
    const D = [
      ['Сегодня', '22 окт', 'sun', '', 11, 21, 'Солнечно весь день, к вечеру лёгкая облачность. Идеально для прогулки после 16:00.', '3 м/с', '4', '48 %'],
      ['Пт', '23 окт', 'cloud', '10 %', 10, 18, 'Переменная облачность, сухо. Утром туман в низинах до 9:00.', '4 м/с', '3', '62 %'],
      ['Сб', '24 окт', 'rain', '70 %', 8, 13, 'Дождь с 11:00 до 16:00, местами сильный. Порывы ветра до 14 м/с.', '7 м/с', '1', '88 %'],
      ['Вс', '25 окт', 'rain', '40 %', 7, 12, 'Кратковременные дожди утром, днём прояснения.', '5 м/с', '2', '80 %'],
      ['Пн', '26 окт', 'cloud', '10 %', 6, 11, 'Пасмурно и прохладно, без осадков.', '4 м/с', '1', '74 %'],
      ['Вт', '27 окт', 'sun', '', 4, 12, 'Ясно, ночью заморозки на почве до −1°.', '2 м/с', '3', '58 %'],
      ['Ср', '28 окт', 'sun', '', 5, 14, 'Солнечно и сухо — лучший день недели для пробежки.', '3 м/с', '3', '55 %'],
      ['Чт', '29 окт', 'cloud', '20 %', 6, 13, 'Облачно с прояснениями, к ночи усиление ветра.', '6 м/с', '2', '70 %'],
      ['Пт', '30 окт', 'snow', '60 %', -1, 4, 'Мокрый снег ночью и утром, гололедица на дорогах.', '8 м/с', '1', '92 %'],
      ['Сб', '31 окт', 'cloud', '10 %', 0, 5, 'Пасмурно, без существенных осадков.', '5 м/с', '1', '84 %']
    ];
    const gmin = -1, gmax = 21;
    const col = (t) => t <= 0 ? '#9CC9FF' : t <= 6 ? '#6FE3FF' : t <= 12 ? '#B6F09C' : t <= 17 ? '#FFD56B' : '#FF9F43';
    const fmt = (t) => (t < 0 ? '−' + Math.abs(t) : String(t)) + '°';
    const days = D.map((d, i) => {
      const left = ((d[4] - gmin) / (gmax - gmin)) * 100;
      const width = ((d[5] - d[4]) / (gmax - gmin)) * 100;
      const open = this.state.open === i;
      return {
        label: d[0], date: d[1], orb: ORB[d[2]], pop: d[3], min: fmt(d[4]), max: fmt(d[5]),
        desc: d[6], wind: d[7], uv: d[8], hum: d[9],
        bar: 'left: ' + left.toFixed(1) + '%; width: ' + width.toFixed(1) + '%; background: linear-gradient(90deg, ' + col(d[4]) + ', ' + col(d[5]) + ');',
        open, exp: open ? 'true' : 'false',
        bg: open ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.05)',
        toggle: () => this.setState({ open: open ? -1 : i })
      };
    });
    return { days };
  }
}
</script>
</body>
</html>
