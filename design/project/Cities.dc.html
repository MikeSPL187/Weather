<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Aura — города</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Unbounded:wght@300;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE7A8}
</style>
</helmet>
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; box-sizing: border-box; background: linear-gradient(180deg, #0A1030 0%, #15205A 100%); font-family: 'Manrope', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 40px 16px 24px;">

  <header style="display: flex; align-items: center; gap: 8px;">
    <a href="Main.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #FFFFFF;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 24px;">Города</h1>
    <button onClick="{{toggleEdit}}" aria-pressed="{{editOn}}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.22); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; {{editS}}">{{editLabel}}</button>
    <a href="Settings.dc.html" aria-label="Настройки" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #FFFFFF;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </header>

  <div style="margin-top: 14px; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 26px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.80)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label for="city" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Найти город</label>
    <input id="city" type="text" placeholder="Город, район или дача" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 15px; outline: none;">
  </div>

  <ul style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{cities}}" as="c" hint-placeholder-count="6">
      <li style="display: flex; align-items: center; gap: 8px;">
        <sc-if value="{{c.edit}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{c.remove}}" aria-label="{{c.removeLabel}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,93,93,0.20); color: #FF9A9A; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
        </sc-if>
        <a href="Main.dc.html" style="flex-grow: 1; height: 84px; border-radius: 26px; position: relative; overflow: hidden; display: flex; align-items: center; padding: 0 18px; text-decoration: none; color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 24px rgba(0,0,0,0.25); {{c.bg}}">
          <span aria-hidden="true" style="position: absolute; right: 74px; top: 18px; width: 46px; height: 46px; border-radius: 50%; {{c.orb}}"></span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; position: relative;">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 700;">{{c.name}}<sc-if value="{{c.here}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Текущее местоположение"><path d="M12 2 4 21l8-4 8 4z"/></svg></sc-if></span>
            <span style="font-size: 12px; color: rgba(255,255,255,0.90);">{{c.sub}}</span>
          </span>
          <span style="font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 300; position: relative;">{{c.temp}}</span>
        </a>
        <sc-if value="{{c.edit}}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="width: 24px; display: flex; flex-direction: column; gap: 4px; align-items: center; flex-shrink: 0;">
            <span style="width: 18px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.7);"></span>
            <span style="width: 18px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.7);"></span>
            <span style="width: 18px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.7);"></span>
          </span>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <sc-if value="{{canRestore}}" hint-placeholder-val="{{ false }}">
    <button onClick="{{restore}}" style="margin-top: 12px; height: 44px; border-radius: 22px; border: 1px dashed rgba(255,255,255,0.35); background: transparent; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">Вернуть удалённые города</button>
  </sc-if>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; padding: 12px 16px; border-radius: 20px; background: rgba(255,181,71,0.12); border: 1px solid rgba(255,181,71,0.35); font-size: 13px; line-height: 1.4; color: rgba(255,255,255,0.92);">
    В бесплатной версии — минутный прогноз для 1 города. <a href="Paywall.dc.html" style="color: #FFD58F; font-weight: 700;">Aura+</a> — для всех.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { edit: false, removed: [] };
  }
  renderVals() {
    const SKY = {
      sun: 'background: linear-gradient(120deg, #1D4ED8 0%, #4F8EF7 100%);',
      rain: 'background: linear-gradient(120deg, #1B2333 0%, #45546F 100%);',
      cloud: 'background: linear-gradient(120deg, #34466E 0%, #6D84AE 100%);',
      clear: 'background: linear-gradient(120deg, #2453C9 0%, #F2A65A 130%);',
      snow: 'background: linear-gradient(120deg, #26324B 0%, #7489AE 100%);'
    };
    const ORB = {
      sun: 'background: radial-gradient(circle at 34% 30%, #FFF8D6 0%, #FFD86B 28%, #FFA92E 62%, #E2701A 100%); box-shadow: 0 0 24px rgba(255,190,80,0.7);',
      rain: 'background: radial-gradient(circle at 35% 28%, #C9D3E6 0%, #8592AD 50%, #4B5670 100%); box-shadow: 0 8px 0 -4px #8FD8FF;',
      cloud: 'background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #EEF3FF 45%, #BFCBE6 100%);',
      clear: 'background: radial-gradient(circle at 34% 30%, #FFF8D6 0%, #FFD86B 28%, #FFA92E 62%, #E2701A 100%); box-shadow: 0 0 24px rgba(255,190,80,0.7);',
      snow: 'background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #EAF2FF 50%, #B8C8E6 100%); box-shadow: 0 0 16px rgba(255,255,255,0.6);'
    };
    const C = [
      ['Москва', '14:20 · Солнечно · ↑21° ↓11°', '18°', 'sun', true],
      ['Санкт-Петербург', '14:20 · Дождь закончится через 12 мин', '11°', 'rain', false],
      ['Казань', '14:20 · Облачно · ↑12° ↓5°', '9°', 'cloud', false],
      ['Алматы', '16:20 · Ясно · ↑16° ↓4°', '14°', 'clear', false],
      ['Ташкент', '16:20 · Ясно · ↑21° ↓8°', '19°', 'clear', false],
      ['Новосибирск', '18:20 · Снег · ↑1° ↓−4°', '−1°', 'snow', false]
    ];
    const edit = this.state.edit;
    const removed = this.state.removed;
    const cities = C.filter((c) => removed.indexOf(c[0]) < 0).map((c) => ({
      name: c[0], sub: c[1], temp: c[2], bg: SKY[c[3]], orb: ORB[c[3]], here: c[4],
      edit: edit && !c[4],
      removeLabel: 'Удалить ' + c[0],
      remove: () => this.setState({ removed: removed.concat([c[0]]) })
    }));
    return {
      cities,
      editOn: edit ? 'true' : 'false',
      editLabel: edit ? 'Готово' : 'Изменить',
      editS: edit ? 'background: #FFFFFF; color: #0A1030;' : 'background: rgba(255,255,255,0.06); color: #FFFFFF;',
      toggleEdit: () => this.setState({ edit: !edit }),
      canRestore: removed.length > 0,
      restore: () => this.setState({ removed: [] })
    };
  }
}
</script>
</body>
</html>
