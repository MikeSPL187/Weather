<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Aura — настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Unbounded:wght@300;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:#B4610A}
</style>
</helmet>
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; padding: 40px 16px 0; {{t.root}}">

  <header style="display: flex; align-items: center; gap: 8px;">
    <a href="Cities.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 24px;">Настройки</h1>
  </header>

  <div style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 14px 0 24px;">

    <a href="Paywall.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 24px; text-decoration: none; {{t.promo}}">
      <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: radial-gradient(circle at 34% 28%, #FFFFFF 0%, #FFE3A0 20%, #FFB547 48%, #6E5BD6 100%); box-shadow: 0 0 20px rgba(255,181,71,0.45);"></span>
      <span style="display: flex; flex-direction: column; flex-grow: 1;">
        <span style="font-size: 16px; font-weight: 700;">Aura+</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.86);">Все города, 3D-карта, советы · 7 дней бесплатно</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; {{t.sub}}">ОФОРМЛЕНИЕ</h2>
      <div style="border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; {{t.card}}">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 15px; font-weight: 700;">Тема</span>
          <div role="radiogroup" aria-label="Тема" style="display: flex; gap: 4px; padding: 4px; border-radius: 16px; {{t.seg}}">
            <sc-for list="{{themes}}" as="o" hint-placeholder-count="3">
              <button role="radio" onClick="{{o.pick}}" aria-checked="{{o.on}}" style="flex: 1; height: 44px; border: 0; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; {{o.s}}">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 15px; font-weight: 700;">Качество 3D-сцены</span>
          <div role="radiogroup" aria-label="Качество 3D-сцены" style="display: flex; gap: 4px; padding: 4px; border-radius: 16px; {{t.seg}}">
            <sc-for list="{{quality}}" as="o" hint-placeholder-count="3">
              <button role="radio" onClick="{{o.pick}}" aria-checked="{{o.on}}" style="flex: 1; height: 44px; border: 0; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; {{o.s}}">{{o.label}}</button>
            </sc-for>
          </div>
          <span style="font-size: 12px; line-height: 1.4; {{t.sub}}">{{qualityNote}}</span>
        </div>
        <button onClick="{{toggleMotion}}" aria-pressed="{{motionOn}}" style="min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: transparent; color: inherit; font-family: inherit; text-align: left; cursor: pointer;">
          <span style="display: flex; flex-direction: column; flex-grow: 1;">
            <span style="font-size: 15px; font-weight: 700;">Уменьшить движение</span>
            <span style="font-size: 12px; {{t.sub}}">Статичная сцена, без параллакса</span>
          </span>
          <span aria-hidden="true" style="width: 50px; height: 30px; border-radius: 15px; position: relative; flex-shrink: 0; {{motionTrack}}"><span style="position: absolute; top: 3px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.3); {{motionKnob}}"></span></span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; {{t.sub}}">ЕДИНИЦЫ</h2>
      <div style="border-radius: 24px; overflow: hidden; {{t.card}}">
        <sc-for list="{{units}}" as="u" hint-placeholder-count="3">
          <button onClick="{{u.cycle}}" style="width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; background: transparent; color: inherit; font-family: inherit; font-size: 15px; cursor: pointer; {{u.line}}">
            <span style="font-weight: 600;">{{u.label}}</span>
            <span style="font-weight: 700; {{t.accent}}">{{u.value}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; {{t.sub}}">ДАННЫЕ И ЯЗЫК</h2>
      <div style="border-radius: 24px; overflow: hidden; {{t.card}}">
        <a href="#source" style="min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-decoration: none; {{t.lineB}}">
          <span style="display: flex; flex-direction: column; flex-grow: 1;">
            <span style="font-size: 15px; font-weight: 600;">Источник прогноза</span>
            <span style="font-size: 12px; {{t.sub}}">Ансамбль: Meteum + ECMWF + ICON</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a href="#lang" style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-decoration: none;">
          <span style="font-size: 15px; font-weight: 600; flex-grow: 1;">Язык</span>
          <span style="font-size: 15px; font-weight: 700; {{t.accent}}">Русский</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Тема"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: null, q: 1, motion: false, units: [0, 0, 0] };
  }
  renderVals() {
    const chosen = this.state.theme === null ? (this.props.theme === 'light' ? 1 : 0) : this.state.theme;
    const light = chosen === 1 || (chosen === 0 && this.props.theme === 'light');
    const T = light ? {
      root: 'background: linear-gradient(180deg, #F2F5FC 0%, #DFE7F7 100%); color: #0E1A3A;',
      card: 'background: #FFFFFF; border: 1px solid rgba(14,26,58,0.10); box-shadow: 0 6px 20px rgba(30,50,110,0.08);',
      seg: 'background: #E6ECF8;',
      sub: 'color: #4A5878;',
      accent: 'color: #9A4F06;',
      promo: 'background: linear-gradient(120deg, #1D2A6B, #3B2F86); color: #FFFFFF;',
      lineB: 'border-bottom: 1px solid rgba(14,26,58,0.10);',
      selOn: 'background: #0E1A3A; color: #FFFFFF;', selOff: 'background: transparent; color: #0E1A3A;'
    } : {
      root: 'background: linear-gradient(180deg, #0A1030 0%, #15205A 100%); color: #FFFFFF;',
      card: 'background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);',
      seg: 'background: rgba(255,255,255,0.08);',
      sub: 'color: rgba(255,255,255,0.78);',
      accent: 'color: #FFC56B;',
      promo: 'background: rgba(255,181,71,0.12); border: 1px solid rgba(255,181,71,0.40); color: #FFFFFF;',
      lineB: 'border-bottom: 1px solid rgba(255,255,255,0.12);',
      selOn: 'background: #FFFFFF; color: #0A1030;', selOff: 'background: transparent; color: #FFFFFF;'
    };
    const seg = (labels, cur, set) => labels.map((label, i) => ({
      label, on: cur === i ? 'true' : 'false', s: cur === i ? T.selOn : T.selOff, pick: () => set(i)
    }));
    const themes = seg(['Авто', 'Светлая', 'Тёмная'], chosen === 0 ? 0 : chosen === 1 ? 1 : 2, (i) => this.setState({ theme: i }));
    const QN = [
      'Флагманы: 90–120 кадров, объёмные облака и капли',
      'Рекомендуем для вашего устройства: 60 кадров, меньше частиц',
      'Статичная сцена с лёгким параллаксом — бережёт батарею'
    ];
    const quality = seg(['Высокое', 'Баланс', 'Эконом'], this.state.q, (i) => this.setState({ q: i }));
    const U = [['Температура', ['°C', '°F']], ['Ветер', ['м/с', 'км/ч']], ['Давление', ['мм рт. ст.', 'гПа']]];
    const units = U.map((u, i) => ({
      label: u[0], value: u[1][this.state.units[i]],
      line: i < U.length - 1 ? T.lineB : '',
      cycle: () => { const a = this.state.units.slice(); a[i] = (a[i] + 1) % u[1].length; this.setState({ units: a }); }
    }));
    const m = this.state.motion;
    return {
      t: T, themes, quality, units, qualityNote: QN[this.state.q],
      motionOn: m ? 'true' : 'false',
      motionTrack: m ? 'background: #34C77B;' : (light ? 'background: #C3CCE0;' : 'background: rgba(255,255,255,0.25);'),
      motionKnob: m ? 'left: 23px;' : 'left: 3px;',
      toggleMotion: () => this.setState({ motion: !m })
    };
  }
}
</script>
</body>
</html>
