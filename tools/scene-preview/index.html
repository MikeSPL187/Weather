<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aura scene preview</title>
<style>
  body { margin: 0; background: #111; }
  #stage { width: 390px; height: 330px; position: relative; }
  canvas { width: 390px; height: 330px; display: block; position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="914"></canvas></div>
<script type="module">
  import { createRenderer } from './renderer.js';
  const params = new URLSearchParams(location.search);
  const base = params.get('data') || '/build/scene-preview/';
  const cases = await (await fetch(base + 'cases.json')).json();
  const name = params.get('case') || Object.keys(cases)[0];
  const frame = cases[name];
  if (params.has('time')) frame.uniforms.uTime = [parseFloat(params.get('time'))];
  const stage = document.getElementById('stage');
  const mid = (a, b) => { const p = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); const x = p(a), y = p(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * 0.55)).join(',')})`; };
  stage.style.background = `linear-gradient(${frame.skyTop}, ${mid(frame.skyTop, frame.skyBottom)}, ${frame.skyBottom})`;
  try {
    const r = await createRenderer(document.getElementById('c'), base);
    await r.render(frame);
    document.title = 'ready';
  } catch (e) {
    document.title = 'error';
    document.body.insertAdjacentHTML('beforeend', `<pre id="err" style="color:#f88">${String(e.message || e)}</pre>`);
  }
</script>
</body>
</html>
